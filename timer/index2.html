
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Timer</title>
  <style>
    body {
      background-color: rgb(39, 36, 36);
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      height: auto;
      width: 30vw;
      background-color: rgba(107, 107, 107, 0.564);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: aliceblue;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
    }



    /* Timer screen */
    #timer {
      display: flex; /* hidden until Start is clicked */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    #countdown {
      display: flex;
      justify-content: space-around;
      gap: 30px;
      margin-top: 20px;
    }

    #countdown span {
      font-size: xx-large;
    }

    #countdown div {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 80px;
      width: 80px;
      background-color: rgb(59, 59, 59);
      border-radius: 15px;
    }

    h2 {
      font-size: 2rem;
      color: rgb(254, 255, 252);
    }

    h4 {
      font-size: large;
      margin-top: 30px;
      margin-bottom: 0px;
    }

    #progress {
      height: 10px;
      width: 80%;
      background-color: aliceblue;
      border-radius: 5px;
      margin-top: 10px;
      margin-bottom: 20px;
    }

    #progress-bar {
      height: 10px;
      width: 0%;
      background-color: rgb(59, 215, 163);
      border-radius: 5px;
      transition: width 1s ease-in-out;
    }
  </style>
    <!-- <script src="script.js"></script> -->
</head>
<body>
  <div class="container">
    
    <!-- Timer Screen -->
    <div id="timer">
      <h2>Countdown</h2>
      <div id="countdown">
        <div><span id="days">00</span>Days</div>
        <div><span id="hours">00</span>Hrs</div>
        <div><span id="mins">00</span>Mins</div>
        <div><span id="secs">00</span>Secs</div>
      </div>

      <h4>Progress:</h4>
      <div id="progress">
        <div id="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
let timer;
let startDate;
let endDate;

function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  return urlParams.get(param);
}

function startCountdown() {
  clearInterval(timer);
  startDate = new Date().getTime();

  const endDateParam = getQueryParam("endDate");
  if (!endDateParam) {
    document.getElementById("countdown").innerHTML = "No End Date Provided!";
    return;
  }

  endDate = new Date(endDateParam).getTime();

  timer = setInterval(updateTimer, 1000);
  updateTimer();
}

function updateTimer() {
  const now = new Date().getTime();
  const distanceCovered = now - startDate;
  const distancePending = endDate - now;

  const days = Math.floor(distancePending / (24*60*60*1000));
  const hrs = Math.floor((distancePending % (24*60*60*1000)) / (60*60*1000));
  const mins = Math.floor((distancePending % (60*60*1000)) / (60*1000));
  const secs = Math.floor((distancePending % (60*1000)) / 1000);

  document.getElementById("days").innerHTML = days;
  document.getElementById("hours").innerHTML = hrs;
  document.getElementById("mins").innerHTML = mins;
  document.getElementById("secs").innerHTML = secs;



  const totalDistance = endDate - startDate;
  const percentageDistance = (distanceCovered / totalDistance) * 100;

  document.getElementById("progress-bar").style.width = percentageDistance + "%";




  if (distancePending < 0) {
    clearInterval(timer);
    document.getElementById("countdown").innerHTML = "EXPIRED";
    document.getElementById("progress-bar").style.width = "100%";
  }
  
  if ( distancePending = 10000) {
        alert("⚠️ Only 10 seconds left!");
  }


}

// Start automatically when page loads
window.onload = startCountdown;

</script>
</body>
</html>
