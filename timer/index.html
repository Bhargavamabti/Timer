<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
        }
        div{
            background-color: rgb(67, 68, 69);
            height: 40%;
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: aliceblue;
            font-size: xx-large;
            font-weight: bolder;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            border-radius: 20px;
        }


         input,  button {
        padding: 8px;
        border-radius: 5px;
        border: none;
        
    }
     button:hover{
        cursor: pointer;
        
     }

    </style>
    <script src="script.js"></script>
</head>
<body>
    <div>
      <label for="endDate">Choose End Date & Time:</label>
      <input type="datetime-local" id="endDate">
      <button onclick="startCountdown()" >Start</button>
    </div>

    <script>
function startCountdown() {
  const inputVal = document.getElementById("endDate").value;
  if (!inputVal) {
    alert("Please select a date & time!");
    return;
  }
  // Redirect to timer page with chosen date
  window.location.href = "index2.html?endDate=" + encodeURIComponent(inputVal);
}
</script>

    
</body>
</html>
